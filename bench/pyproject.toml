[project]
name = "kikitori-bench"
version = "0.1.0"
description = "On-device Japanese speech-to-text benchmark for kikitori"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "demucs>=4.0.1",
    "huggingface-hub>=2.2.0",
    "jiwer>=4.0.0",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pykakasi>=2.3.0",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "transformers>=5.20.2",
]

